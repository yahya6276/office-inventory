<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldHub ERP - Debug Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">🛠️ ERP Connection Debugger</h1>
        <p id="debugStatus" class="text-sm text-slate-500 mt-1">Status: Ready to connect...</p>
      </div>
      <button onclick="testConnection()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition">
        🚀 Test & Load Sheet Data
      </button>
    </div>

    <!-- Data Display Box -->
    <div class="bg-white p-6 rounded-2xl shadow-md">
      <h3 class="font-bold text-lg mb-3">📊 Result & Employees Count:</h3>
      <div id="resultBox" class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono text-slate-700 min-h-[150px]">
        Click the "Test & Load Sheet Data" button above to check connection.
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBxNs-ZJ8jtTg2ZEdQ8trQczKrsrh3OfDtTW8X2pnVq1FP_qSU5EI0rAbRgqq2Kt2Uwg/exec";

    async function testConnection() {
      const statusEl = document.getElementById('debugStatus');
      const box = document.getElementById('resultBox');
      
      statusEl.innerText = "Status: Connecting to Google Apps Script...";
      box.innerText = "Fetching data from: " + SCRIPT_URL + " ...";

      try {
        const response = await fetch(SCRIPT_URL, { method: "GET", redirect: "follow" });
        const textResponse = await response.text();
        
        console.log("Raw Response:", textResponse);
        
        let jsonData = JSON.parse(textResponse);
        
        let empCount = jsonData.employees ? jsonData.employees.length : 0;
        let issuedCount = jsonData.issued ? jsonData.issued.length : 0;
        let consumedCount = jsonData.consumed ? jsonData.consumed.length : 0;

        statusEl.innerText = "Status: Connected Successfully! ✅";
        box.innerHTML = `
          <p class="text-emerald-600 font-bold text-base mb-2">Connection Successful!</p>
          <ul class="space-y-1">
            <li>👥 Employees Rows Found: <b>${empCount}</b></li>
            <li>📤 Issued Rows Found: <b>${issuedCount}</b></li>
            <li>📥 Consumption Rows Found: <b>${consumedCount}</b></li>
          </ul>
          <p class="mt-4 text-xs text-slate-400">First Employee Data: ${JSON.stringify(jsonData.employees ? jsonData.employees[1] : 'None')}</p>
        `;

        alert("کامیابی! ملازمین کا ڈیٹا مل گیا ہے، تعداد: " + empCount);

      } catch (err) {
        console.error("Error:", err);
        statusEl.innerText = "Status: Failed ❌";
        box.innerHTML = `<span class="text-rose-600 font-bold">Error: ${err.message}</span>`;
        alert("کنکشن میں ایرر آ گیا: " + err.message);
      }
    }

    // Automatically trigger on load
    window.onload = () => {
      testConnection();
    };
  </script>
</body>
</html>
